<form method="POST" class="review-form">

    {% csrf_token %}

    <label for="rating">Rating</label>

    <select name="rating" id="rating">
        <option value="1">1 ⭐</option>
        <option value="2">2 ⭐</option>
        <option value="3">3 ⭐</option>
        <option value="4">4 ⭐</option>
        <option value="5">5 ⭐</option>
    </select>

    <label for="review">Review</label>

    <textarea
        name="review"
        id="review"
        rows="5"
        placeholder="Write your review..."
    ></textarea>

    <button type="submit" class="review-btn">
        Submit Review
    </button>

</form>
<style>
    .review-form {
    width: 500px;
    margin: 40px auto;
    padding: 25px;
    border-radius: 10px;
    background-color: #f5f5f5;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

.review-form label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

.review-form select,
.review-form textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

.review-form textarea {
    resize: vertical;
}

.review-btn {
    color: white;
    width: 100%;
    height: 45px;
    background-color: rgb(234, 73, 73);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.review-btn:hover {
    background-color: rgb(210, 55, 55);
}   
</style>
